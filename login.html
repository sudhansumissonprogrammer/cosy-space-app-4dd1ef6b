<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
    --blue: #3d5afe;
    --blue-dark: #2a3eb1;
    --white: #ffffff;
    --gray-50: #f8f8fc;
    --gray-100: #f1f1f8;
    --gray-200: #e2e2ee;
    --gray-300: #c0c0d8;
    --gray-400: #9090b0;
    --gray-500: #686890;
    --gray-700: #3a3a58;
    --gray-900: #11112a;
    --border: #e4e4f0;
}

html, body {
    height: 100%;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 15px;
    color: var(--gray-900);
    -webkit-font-smoothing: antialiased;
    background: var(--white);
}

/* ── LAYOUT ── */
.rz-page {
    display: flex;
    min-height: 100vh;
}

/* ─────────────────
   LEFT PANEL (ULTRA PREMIUM)
───────────────── */
.rz-left {
    flex: 1;
    position: relative;
    overflow: hidden;

    /* 🔥 Animated Gradient */
    background: linear-gradient(120deg,
        #dff8f2,
        #e6f2ff,
        #ecfdf5,
        #f0f9ff,
        #f0fff4
    );
    background-size: 300% 300%;
    animation: gradientFlow 12s ease infinite;

    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 48px 56px;
    min-height: 100vh;
}

/* 🌊 Gradient Animation */
@keyframes gradientFlow {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

/* ───────────────
   LIGHT GLOW LAYERS
──────────────── */
.rz-left::before,
.rz-left::after {
    content: "";
    position: absolute;
    width: 600px;
    height: 600px;
    border-radius: 50%;
    filter: blur(120px);
    opacity: 0.5;
    z-index: 0;
}

.rz-left::before {
    top: -150px;
    left: -100px;
    background: #a7f3d0;
}

.rz-left::after {
    bottom: -150px;
    right: -100px;
    background: #bfdbfe;
}

/* ───────────────
   DIAGONAL LINES (IMPROVED)
──────────────── */
.rz-lines {
    position: absolute;
    inset: -70%;
    transform: rotate(-28deg);
    pointer-events: none;
    z-index: 0;
}

.rz-line {
    position: absolute;
    top: 0;
    bottom: 0;
    opacity: 0;
    animation: rzShimmer 8s ease-in-out infinite;
    backdrop-filter: blur(6px);
}

/* Soft gradient lines */
.l1 { left: 6%;  width: 5%; background: linear-gradient(180deg,#ffffffaa,#ffffff00); }
.l2 { left: 14%; width: 4%; background: linear-gradient(180deg,#bbf7d0aa,#ffffff00); }
.l3 { left: 22%; width: 7%; background: linear-gradient(180deg,#ffffffaa,#ffffff00); }
.l4 { left: 33%; width: 4%; background: linear-gradient(180deg,#bae6fdaa,#ffffff00); }
.l5 { left: 42%; width: 6%; background: linear-gradient(180deg,#ffffffaa,#ffffff00); }
.l6 { left: 52%; width: 5%; background: linear-gradient(180deg,#a7f3d0aa,#ffffff00); }
.l7 { left: 63%; width: 8%; background: linear-gradient(180deg,#ffffffaa,#ffffff00); }
.l8 { left: 75%; width: 4%; background: linear-gradient(180deg,#bbf7d0aa,#ffffff00); }
.l9 { left: 84%; width: 6%; background: linear-gradient(180deg,#ffffffaa,#ffffff00); }

/* smoother animation */
@keyframes rzShimmer {
    0%   { opacity: 0; transform: translateY(-20%); }
    25%  { opacity: .7; }
    50%  { opacity: 1; }
    75%  { opacity: .7; }
    100% { opacity: 0; transform: translateY(20%); }
}

/* ───────────────
   BRAND
──────────────── */
.rz-left-brand {

}

    filter: brightness(0) saturate(100%) invert(20%) sepia(60%) saturate(400%) hue-rotate(170deg);

/* subtle hover glow */

}

/* ───────────────
   CONTENT
──────────────── */

/* Fields */
.rz-field { margin-bottom: 12px; }

.rz-input {
    width: 100%;
    padding: .74rem .95rem;
    font-family: 'Inter', sans-serif;
    font-size: .9rem;

.rz-input::placeholder { color: var(--gray-300); font-size: .86rem; }

/* Password */
.rz-pw-wrap { position: relative; }
.rz-pw-wrap .rz-input { padding-right: 2.6rem; }
.rz-pw-eye {
    position: absolute; right: 11px; top: 50%;

/* Options */
.rz-options { margin-bottom: 18px; }

.rz-remember {

.rz-remember input { position: absolute; opacity: 0; width: 0; height: 0; }

.rz-cb {

@media (max-width: 480px) {

<script>
document.addEventListener('DOMContentLoaded', function () {

    // Password visibility toggle
    const pwToggle = document.getElementById('pwToggle');
    const pwInput  = document.getElementById('password');

    if (pwToggle && pwInput) {
        pwToggle.addEventListener('click', function () {
            const visible = pwInput.type === 'password';
            pwInput.type  = visible ? 'text' : 'password';
            this.querySelector('.eye-on').style.display  = visible ? 'none' : '';
            this.querySelector('.eye-off').style.display = visible ? '' : 'none';
            pwInput.focus();
        });
    }

    // Loading state on submit
    const form = document.getElementById('loginForm');
    const btn  = document.getElementById('submitBtn');

    if (form && btn) {
        form.addEventListener('submit', function () {
            btn.disabled = true;
            const lbl  = document.getElementById('btnLabel');
            const arr  = document.getElementById('btnArrow');
            const spin = document.getElementById('btnSpinner');
            if (lbl)  lbl.textContent    = 'Signing in…';
            if (arr)  arr.style.display  = 'none';
            if (spin) spin.style.display = '';
        });
    }

});
