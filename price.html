<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prodoxy Pricing</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

/* ===== RESET ===== */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Inter',sans-serif;
  padding-top:80px;
}

/* ===== HEADER ===== */

.header{
  width:100%;
  position:fixed;
  top:0;
  left:0;
  background:#ffffff;
  z-index:1000;
  transition:0.3s ease;
}

.header.scrolled{
  box-shadow:0 10px 30px rgba(0,0,0,0.05);
}

.container{
  max-width:1280px;
  margin:auto;
  padding:0 24px;
}

.navbar{
  height:80px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

/* ===== LOGO ===== */
.logo img{
  height:30px;
}

/* ===== NAV LINKS ===== */

.nav-links{
  display:flex;
  align-items:center;
  gap:28px;
}

.nav-links a{
  text-decoration:none;
  color:#111;
  font-weight:500;
  font-size:15px;
  transition:0.3s;
}

.nav-links a:hover{
  color:#df4e1e;
}

/* ===== DROPDOWN ===== */

.dropdown{
  position:relative;
}

.dropdown-menu{
  position:absolute;
  top:120%;
  left:0;
  background:#fff;
  padding:15px 0;
  border-radius:12px;
  box-shadow:0 15px 40px rgba(0,0,0,0.08);
  display:none;
  flex-direction:column;
  min-width:200px;
}

.dropdown-menu a{
  padding:10px 20px;
  font-size:14px;
  color:#111;
}

.dropdown:hover .dropdown-menu{
  display:flex;
}

/* ===== BUTTON ===== */

.nav-buttons{
  display:flex;
  align-items:center;
}

.btn-login{
  padding:8px 18px;
  margin-left: 100px;
  border-radius:999px;
  border:1px solid #df4e1e;
  font-weight:600;
  font-size:14px;
  text-decoration:none;
color:#111;
}

/* ===== MOBILE MENU ===== */

.menu-toggle{
  display:none;
  flex-direction:column;
  gap:5px;
  cursor:pointer;
}

.menu-toggle span{
  width:24px;
  height:2px;
  background:#111;
}

/* ===== RESPONSIVE ===== */

@media(max-width:992px){

  .nav-links{
    position:fixed;
    top:100px;
    bottom:100px;
    left:0;
    width:100%;
    background:#fff;
    flex-direction:column;
    align-items:flex-start;
    padding:30px 24px;
    gap:18px;
    transform:translateY(-120%);
    transition:0.4s ease;
  }

  .nav-links.active{
    transform:translateY(0);
  }

  .dropdown-menu{
    position:static;
    box-shadow:none;
    padding-left:15px;
    display:none;
  }

  .dropdown.active .dropdown-menu{
    display:flex;
  }

  .menu-toggle{
    display:flex;
  }

}

</style>

<body>

<header class="header" id="header">

    <!-- LOGO -->
    <a href="/" class="logo">
      <img src="https://prodoxy.com/img/prodoxy_logo-without-bg2.png" alt="Prodoxy Logo">
    </a>

    <!-- NAV LINKS -->
    <div class="nav-links" id="navMenu">

        <a href="/">Home</a>
      <a href="https://prodoxy.com/about">About</a>
      <a href="https://prodoxy.com/pricing">Pricing</a>
      <a href="https://prodoxy.com/feature">Features</a>
      <a href="#">Blog</a>
      <a href="https://prodoxy.com/contact">Contact</a>

      <!-- LEGAL DROPDOWN -->
      <div class="dropdown" id="legalDropdown">
        <a href="#">Legal ▾</a>
        <div class="dropdown-menu">
          <a href="https://prodoxy.com/privacy_policy">Privacy Policy</a>
          <a href="https://prodoxy.com/terms">Terms of Service</a>
          <a href="https://prodoxy.com/refund_policy">Refund Policy</a>
          <a href="#">Security</a>
        </div>
      </div>

    </div>

    <!-- LOGIN BUTTON -->
    <div class="nav-buttons">
      <a href="https://prodoxy.com/login" class="btn-login">Log in</a>
    </div>

    <!-- MOBILE MENU ICON -->
    <div class="menu-toggle" id="menuToggle">
      <span></span>
      <span></span>
      <span></span>
    </div>

  </div>
</header>

<script>

/* Elements */
const toggle = document.getElementById("menuToggle");
const nav = document.getElementById("navMenu");
const header = document.getElementById("header");
const dropdown = document.getElementById("legalDropdown");

/* Mobile Toggle */
toggle.addEventListener("click",()=>{
  nav.classList.toggle("active");
});

/* Mobile Dropdown Toggle */
dropdown.addEventListener("click",function(){
  if(window.innerWidth < 992){
    this.classList.toggle("active");
  }
});

/* Scroll Shadow */
window.addEventListener("scroll",()=>{
  if(window.scrollY > 20){
    header.classList.add("scrolled");
  }else{
    header.classList.remove("scrolled");
  }
});

</script>

</body>
</html>

<!-- ===== COUNTDOWN TOP BAR START ===== -->

<style>
.px-topbar{
  width:100%;
  background:#c6ff00;
  color:#000;
  font-family:'Poppins',sans-serif;
  font-size:14px;
  font-weight:500;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:20px;
  padding:8px 10px;
  position:relative;
  z-index:9999;
}

.px-timer{
  display:flex;
  gap:10px;
  font-weight:600;
}

.px-time-box{
  display:flex;
  gap:4px;
}

.px-topbar a{
  color:#000;
  font-weight:600;
  text-decoration:underline;
}

@media(max-width:600px){
  .px-topbar{
    font-size:12px;
    flex-wrap:wrap;
    text-align:center;
  }
}
</style>

<div class="px-topbar">
  <div>Don’t miss the limited-time deals!</div>

  <div class="px-timer">
    <div class="px-time-box"><span id="days">2</span>D</div>
    <div class="px-time-box"><span id="hours">00</span>H</div>
    <div class="px-time-box"><span id="minutes">00</span>M</div>
    <div class="px-time-box"><span id="seconds">00</span>S</div>
  </div>
</div>

<script>

// 7 Days + 5 Hours in milliseconds
const duration = (7 * 24 * 60 * 60 * 1000) + (5 * 60 * 60 * 1000);

let endTime = localStorage.getItem("pxCountdownEnd");

if (!endTime) {
  endTime = new Date().getTime() + duration;
  localStorage.setItem("pxCountdownEnd", endTime);
}

function updateCountdown() {
  const now = new Date().getTime();
  let distance = endTime - now;

  if (distance <= 0) {
    // Reset automatically
    endTime = new Date().getTime() + duration;
    localStorage.setItem("pxCountdownEnd", endTime);
    distance = duration;
  }

  const days = Math.floor(distance / (1000 * 60 * 60 * 24));
  const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
  const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
  const seconds = Math.floor((distance % (1000 * 60)) / 1000);

  document.getElementById("days").innerText = String(days).padStart(2,'0');
  document.getElementById("hours").innerText = String(hours).padStart(2,'0');
  document.getElementById("minutes").innerText = String(minutes).padStart(2,'0');
  document.getElementById("seconds").innerText = String(seconds).padStart(2,'0');
}

setInterval(updateCountdown, 1000);
updateCountdown();

</script>

<!-- ===== COUNTDOWN TOP BAR END ===== -->

function setPlan(plan, el){
