    <!-- Inline critical above-the-fold styles to prevent FOUC -->
    <style>
      body{margin:0;font-family:'Inter','Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
      #root{min-height:100vh}
      @keyframes shimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}
      .sk{background:#f0f0f0;border-radius:8px}
      .sk-shimmer{background:linear-gradient(90deg,#f0f0f0 25%,#e0e0e0 50%,#f0f0f0 75%);background-size:400px 100%;animation:shimmer 1.2s infinite}
      .sf-skel{max-width:100%;padding:0}
      .sf-skel-nav{height:56px;background:#fff;border-bottom:1px solid #eee;display:flex;align-items:center;padding:0 16px;gap:12px}
      .sf-skel-hero{width:100%;aspect-ratio:16/7;background:#f0f0f0}
      .sf-skel-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:16px}
      .sf-skel-card{border-radius:12px;overflow:hidden}
      .sf-skel-card-img{width:100%;aspect-ratio:4/5}
      .sf-skel-card-txt{padding:8px}
      .sf-skel-card-txt div{height:10px;margin-bottom:6px;border-radius:4px}
      @media(min-width:768px){.sf-skel-grid{grid-template-columns:repeat(4,1fr);gap:16px;padding:24px}}
    </style>
    <!--
      Preload storefront API data + LCP hero image:
      Starts fetch DURING JS parse so data is ready when React mounts.
      Also injects <link rel=preload> for the hero banner image to eliminate LCP delay.
    -->
    <script>
      (function(){
        var slug;
        var p=location.pathname;
        if(p.indexOf('/store/')===0){slug=p.split('/store/')[1];if(slug)slug=slug.split('/')[0];}
        if(!slug){
          // Try subdomain
          var h=location.hostname;
          if(h.endsWith('.storivo.in')&&h!=='storivo.in'&&h!=='www.storivo.in'){
            var sub=h.replace('.storivo.in','');
            if(sub&&sub.indexOf('.')===-1)slug=sub;
          }
        }
        if(!slug)return;

        // Preconnect to image hosts we'll likely need
        var pc=document.createElement('link');pc.rel='preconnect';pc.href='https://overlaysnow.com';document.head.appendChild(pc);

        var url='https://kzvfjknnslgcwumzlwkb.supabase.co/rest/v1/rpc/get_storefront_data';
        var key='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt6dmZqa25uc2xnY3d1bXpsd2tiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM4NDU1NzEsImV4cCI6MjA4OTQyMTU3MX0.c6TPp3cHVEF2JHYtFcfrCZTlp712eG6t6DwqMaHCAMg';
        window.__STOREFRONT_PREFETCH__=fetch(url,{
          method:'POST',
          headers:{'Content-Type':'application/json','apikey':key,'Authorization':'Bearer '+key},
          body:JSON.stringify({_slug:slug,_product_limit:50})
        }).then(function(r){return r.json()}).then(function(data){
          // Inject <link rel=preload> for LCP hero image immediately
          if(data&&data.store){
            var heroUrl=data.store.mobile_hero_url;
            // Try mobile_hero_images array first
            var heroImages=data.store.mobile_hero_images;
            if(heroImages){
              try{
                var arr=typeof heroImages==='string'?JSON.parse(heroImages):heroImages;
                if(Array.isArray(arr)&&arr[0])heroUrl=arr[0];
              }catch(e){}
            }
            if(heroUrl){
              // Optimize URL for Supabase storage
              var optUrl=heroUrl;
              if(heroUrl.indexOf('supabase.co/storage')>-1){
                optUrl=heroUrl.replace('/storage/v1/object/','/storage/v1/render/image/');
                optUrl+=(optUrl.indexOf('?')>-1?'&':'?')+'width=800&quality=75';
              }
              var lnk=document.createElement('link');
              lnk.rel='preload';lnk.as='image';lnk.href=optUrl;
              lnk.setAttribute('fetchpriority','high');
              document.head.appendChild(lnk);
            }
            // Also preload logo
            if(data.store.logo_url){
              var logoLnk=document.createElement('link');
              logoLnk.rel='preload';logoLnk.as='image';logoLnk.href=data.store.logo_url;
              document.head.appendChild(logoLnk);
            }
          }
          return data;
        }).catch(function(){return null});
      })();
    </script>

        <div class="sf-skel-hero sk-shimmer"></div>
        <div class="sf-skel-grid">
          <div class="sf-skel-card"><div class="sf-skel-card-img sk sk-shimmer"></div><div class="sf-skel-card-txt"><div class="sk sk-shimmer" style="width:60%"></div><div class="sk sk-shimmer" style="width:40%"></div></div></div>
          <div class="sf-skel-card"><div class="sf-skel-card-img sk sk-shimmer"></div><div class="sf-skel-card-txt"><div class="sk sk-shimmer" style="width:70%"></div><div class="sk sk-shimmer" style="width:35%"></div></div></div>
          <div class="sf-skel-card"><div class="sf-skel-card-img sk sk-shimmer"></div><div class="sf-skel-card-txt"><div class="sk sk-shimmer" style="width:55%"></div><div class="sk sk-shimmer" style="width:45%"></div></div></div>
          <div class="sf-skel-card"><div class="sf-skel-card-img sk sk-shimmer"></div><div class="sf-skel-card-txt"><div class="sk sk-shimmer" style="width:65%"></div><div class="sk sk-shimmer" style="width:38%"></div></div></div>
        </div>
