    <!-- ─── First-party visitor ID cookie (analytics only) ───
         Sets `sb_vid` if missing. Used server-side by the Worker on the NEXT
         page view to count unique visitors accurately (immune to mobile
         carrier NAT / shared IPs). 1-year expiry, first-party, SameSite=Lax.
         No PII, no cross-site tracking. -->
    <script>
      (function(){
        try{
          var k='sb_vid';
          if(document.cookie.indexOf(k+'=')===-1){
            var b=new Uint8Array(16);
            (window.crypto||window.msCrypto).getRandomValues(b);
            b[6]=(b[6]&0x0f)|0x40;b[8]=(b[8]&0x3f)|0x80;
            var h=[];for(var i=0;i<16;i++)h.push((b[i]+0x100).toString(16).slice(1));
            var v=h[0]+h[1]+h[2]+h[3]+'-'+h[4]+h[5]+'-'+h[6]+h[7]+'-'+h[8]+h[9]+'-'+h[10]+h[11]+h[12]+h[13]+h[14]+h[15];
            document.cookie=k+'='+v+';path=/;max-age=31536000;samesite=lax';
          }
        }catch(e){}
      })();

    <!-- ─── Analytics sendBeacon shim ───
         Lovable's flock.js posts to /~api/analytics with a blocking fetch that
         steals a TCP connection slot from real critical resources (~1.1s seen
         on 5G mobile). We intercept that exact path BEFORE flock.js loads and
         redirect it to navigator.sendBeacon, which is fire-and-forget and uses
         the browser's background queue (zero impact on critical path). -->
    <script>
      (function(){
        if (typeof window === 'undefined') return;
        var origFetch = window.fetch;
        if (!origFetch) return;
        var BEACON = navigator && navigator.sendBeacon ? navigator.sendBeacon.bind(navigator) : null;
        window.fetch = function(input, init){
          try {
            var url = typeof input === 'string' ? input : (input && input.url) || '';
            var method = (init && init.method) || (input && input.method) || 'GET';
            if (BEACON && url.indexOf('/~api/analytics') !== -1 && String(method).toUpperCase() === 'POST') {
              var body = init && init.body;
              var blob;
              try {
                if (body instanceof Blob) blob = body;
                else if (typeof body === 'string') blob = new Blob([body], { type: 'application/json' });
                else if (body) blob = new Blob([JSON.stringify(body)], { type: 'application/json' });
              } catch (e) {}
              var ok = false;
              try { ok = BEACON(url, blob || ''); } catch (e) {}
              if (ok) {
                return Promise.resolve(new Response(null, { status: 204, statusText: 'No Content' }));
              }
            }
          } catch (e) {}
          return origFetch.apply(this, arguments);
        };
      })();
    </script>

    <script>
      (function(){
        /* ─── Phase 1: Pre-React Facebook Pixel shim ───
           Only set up the shim if we're actually on a storefront route — landing
           and auth pages never have a pixel ID, so running this code wastes parse
           time on the critical path. */
        var p=location.pathname;var h=location.hostname;
        var isSf=p.indexOf('/store/')===0;
        if(!isSf && h.endsWith('.shopbanao.in') && h!=='shopbanao.in' && h!=='www.shopbanao.in'){
          var sub=h.replace('.shopbanao.in','');if(sub&&sub.indexOf('.')===-1)isSf=true;
        }
        if(!isSf && window.__STORE_SLUG__)isSf=true;
        if(!isSf)return; // landing/auth — skip pixel shim entirely

        (function initFbqEarly(){
          var w=window;if(w.fbq)return;
          var q=function(){q.callMethod?q.callMethod.apply(q,arguments):q.queue.push(arguments)};
          if(!w._fbq)w._fbq=q;q.push=q;q.loaded=true;q.version='2.0';q.queue=[];w.fbq=q;
          var pid=w.__STOREFRONT_DATA__&&w.__STOREFRONT_DATA__.store&&w.__STOREFRONT_DATA__.store.facebook_pixel_id;
          if(pid){
            w.__SF_PIXEL_INITED__=pid;
            w.fbq('init',pid);
            w.fbq('track','PageView');
            var loadSdk=function(){
              if(document.getElementById('fb-pixel-script'))return;
              var s=document.createElement('script');s.id='fb-pixel-script';s.async=true;
              s.src='https://connect.facebook.net/en_US/fbevents.js';document.head.appendChild(s);
            };
            var loaded=false;var wrap=function(){if(loaded)return;loaded=true;loadSdk();};
            if('requestIdleCallback' in w){w.requestIdleCallback(wrap,{timeout:4000});}else{setTimeout(wrap,2000);}
            // Also load on first interaction so fast clickers (Add to Cart, Checkout) don't wait for idle
            ['pointerdown','touchstart','keydown'].forEach(function(ev){
              w.addEventListener(ev,wrap,{once:true,passive:true,capture:true});
            });
          }
        })();

        /* If Worker already injected fonts (data-sf-font), skip — single source of truth.
           Otherwise (preview/localhost), fall back to dynamic Google Fonts injection. */
        function injectGFont(hf,bf){
          if(document.querySelector('link[data-sf-font]'))return;
          var self=['Inter','Outfit','Alegreya SC','Poppins','Montserrat Alternates'];
          var families=[];
          [hf,bf].forEach(function(f){if(f&&self.indexOf(f)===-1){var seen=families.indexOf(f);if(seen===-1)families.push(f);}});
          if(!families.length)return;
          var href='https://fonts.googleapis.com/css2?'+families.map(function(f){return'family='+f.replace(/ /g,'+') +':wght@400;600;700'}).join('&')+'&display=swap';
          var link=document.createElement('link');link.rel='stylesheet';link.href=href;link.id='storefront-google-fonts';
          link.setAttribute('fetchpriority','high');document.head.appendChild(link);
        }
        if(window.__THEME__){injectGFont(window.__THEME__.hf,window.__THEME__.bf);}

        // If Worker already injected __STOREFRONT_DATA__, we're done — products
        // are already inlined via window.__PRODUCTS_INLINE__ (set by Worker).
        // Only prefetch /api/products if the Worker did NOT inline products
        // (rare cold-cache case). This avoids ~1 redundant Worker request per visit.
        if(window.__STOREFRONT_DATA__){
          if(!window.__THEME__&&window.__STOREFRONT_DATA__.theme){
            var t=window.__STOREFRONT_DATA__.theme;
            injectGFont(t.heading_font,t.body_font);
          }
          // v7.9 (Tier 2): Skip redundant /api/products Worker hit when shell is
          // inlined but products aren't. React Query will fetch directly from
          // Supabase REST (which doesn't go through our Worker), saving 1 event
          // per cold visit where the Worker injected shell-only.
          if(!window.__PRODUCTS_INLINE__){
            try{
              var sd=window.__STOREFRONT_DATA__;
              if(sd&&sd.store&&sd.store.id){
                var supaUrl='https://dqepeywgftbpxeeqfuwt.supabase.co';
                var key='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRxZXBleXdnZnRicHhlZXFmdXd0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUzMjgxMzksImV4cCI6MjA5MDkwNDEzOX0.OtLtoGBJZuEthQyePzNgAltWJwSUEpWl1z_Bx_FY6Mk';
                var prodUrl=supaUrl+'/rest/v1/products?store_id=eq.'+sd.store.id+'&is_active=eq.true&order=is_best_selling.desc,created_at.desc,id.asc&limit=20&select=id,category,currency,description,image_url,is_active,is_best_selling,name,price,sale_price,slug,stock_quantity,store_id';
                window.__PRODUCTS_PREFETCH__=fetch(prodUrl,{headers:{'apikey':key,'Authorization':'Bearer '+key}}).then(function(r){return r.json()}).catch(function(){return null});
              }
            }catch(e){}
          }
          return;
        }

        var slug;
        if(window.__STORE_SLUG__){slug=window.__STORE_SLUG__;}
        if(!slug){var p=location.pathname;if(p.indexOf('/store/')===0){slug=p.split('/store/')[1];if(slug)slug=slug.split('/')[0];}}
        if(!slug){
          var h=location.hostname;
          if(h.endsWith('.shopbanao.in')&&h!=='shopbanao.in'&&h!=='www.shopbanao.in'){
            var sub=h.replace('.shopbanao.in','');
            if(sub&&sub.indexOf('.')===-1)slug=sub;
          }
        }
        if(!slug)return;

        var supaUrl='https://dqepeywgftbpxeeqfuwt.supabase.co';
        var key='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRxZXBleXdnZnRicHhlZXFmdXd0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUzMjgxMzksImV4cCI6MjA5MDkwNDEzOX0.OtLtoGBJZuEthQyePzNgAltWJwSUEpWl1z_Bx_FY6Mk';

        /* ─── Bootstrap cache (set by previous visit) ───
           Synchronously read store_id + fonts + top image URLs to:
             1. Inject LCP image preload at T+0 (saves ~300ms on repeat LCP)
             2. Inject Google Fonts preload at T+0 (saves ~150ms FOUT window)
             3. Fire products fetch IN PARALLEL with shell (saves ~150ms RTT) */
        var boot=null;
        try{var bs=localStorage.getItem('sf_boot_'+slug);if(bs)boot=JSON.parse(bs);}catch(e){}
        if(boot){
          if(boot.hf||boot.bf)injectGFont(boot.hf,boot.bf);
          if(Array.isArray(boot.imgs)){
            for(var bi=0;bi<boot.imgs.length && bi<2;bi++){
              var bu=boot.imgs[bi];if(!bu||typeof bu!=='string')continue;
              if(document.querySelector('link[data-sf-img-pre="'+bu+'"]'))continue;
              var bl=document.createElement('link');
              bl.rel='preload';bl.as='image';bl.href=bu;
              bl.setAttribute('data-sf-img-pre',bu);
              if(bi===0)bl.setAttribute('fetchpriority','high');
              document.head.appendChild(bl);
            }

        }

        /* v6.5.0 preview parity: inject <link rel="preload" as="image"> tags
           the moment product URLs arrive. The browser preload-scanner can't
           read URLs from <script> data, so we materialize them as <link> tags
           in <head> immediately. This kicks off image downloads in parallel
           with the React JS bundle instead of after hydration. */
        function injectProductImagePreloads(products){
          if(!Array.isArray(products))return;
          var head=document.head;var injected=0;
          for(var i=0;i<products.length && injected<6;i++){
            var pp=products[i];var u=pp&&pp.image_url;
            if(!u||typeof u!=='string')continue;
            if(document.querySelector('link[data-sf-img-pre="'+u+'"]'))continue;
            var l=document.createElement('link');
            l.rel='preload';l.as='image';l.href=u;
            l.setAttribute('data-sf-img-pre',u);
            if(injected<2)l.setAttribute('fetchpriority','high');
            head.appendChild(l);injected++;
          }
        }

        /* CRITICAL: kick off shell + products in PARALLEL.
           For repeat visitors with a cached store_id we fire products
           IMMEDIATELY in true parallel (no waterfall). For first-time
           visitors we fall back to the sequential .then() path. */
        var shellPromise=fetch(supaUrl+'/rest/v1/rpc/get_storefront_shell',{
          method:'POST',
          headers:{'Content-Type':'application/json','apikey':key,'Authorization':'Bearer '+key},
          body:JSON.stringify({_slug:slug})
        }).then(function(r){return r.json()}).then(function(data){
          if(data&&data.store){
            window.__STOREFRONT_DATA__=data;
            if(data.theme)injectGFont(data.theme.heading_font,data.theme.body_font);
          }
          return data;
        }).catch(function(){return null});

        function buildProductsUrl(sid){
          return supaUrl+'/rest/v1/products?store_id=eq.'+sid+'&is_active=eq.true&order=is_best_selling.desc,created_at.desc,id.asc&limit=20&select=id,category,currency,description,image_url,is_active,is_best_selling,name,price,sale_price,slug,stock_quantity,store_id';
        }
        var productsPromise;
        if(boot&&boot.sid){
          /* Repeat visitor: TRUE PARALLEL — fire products at T+0 alongside shell */
          productsPromise=fetch(buildProductsUrl(boot.sid),{headers:{'apikey':key,'Authorization':'Bearer '+key}})
            .then(function(r){return r.json()})
            .then(function(products){injectProductImagePreloads(products);return products;})
            .catch(function(){return null});
        }else{
          /* First-time visitor: chain to shell so we have a real store_id */
          productsPromise=shellPromise.then(function(data){
            if(!data||!data.store)return null;
            return fetch(buildProductsUrl(data.store.id),{headers:{'apikey':key,'Authorization':'Bearer '+key}})
              .then(function(r){return r.json()})
              .then(function(products){injectProductImagePreloads(products);return products;})
              .catch(function(){return null});
          });
        }
        window.__PRODUCTS_PREFETCH__=productsPromise;
        window.__STOREFRONT_PREFETCH__=shellPromise;
      })();

    <script>
      /* Skeleton visibility logic.
         v6.3.0: If Worker already injected #sf-skel (sets window.__SF_WORKER__),
         remove the inline duplicate immediately — Worker skeleton is the single
         source of truth in production. Otherwise fall back to route-based hiding. */
      (function(){
        if(window.__SF_WORKER__){
          var sk=document.getElementById('inline-skel');
          if(sk){sk.style.display='none';if(sk.remove)sk.remove();}
          return;
        }
        var p=location.pathname;var h=location.hostname;
        var isSf=p.indexOf('/store/')===0;
        if(!isSf && h.endsWith('.shopbanao.in') && h!=='shopbanao.in' && h!=='www.shopbanao.in'){
          var sub=h.replace('.shopbanao.in','');if(sub&&sub.indexOf('.')===-1)isSf=true;

    <script>
      /* Remove skeleton ONLY after real storefront content has actually
         painted into #root. This prevents the blank-white flash that
         happens when storefront:content-ready fires before lazy-loaded
         home page chunks (hero, grids, images) have mounted.

         Strategy:
           1. Wait for storefront:content-ready (data ready signal)
           2. Then poll until #root contains rendered content beyond the
              inline skeleton (i.e. real React DOM with non-zero size)
           3. Wait 2 animation frames so the browser actually paints
           4. Then hide both skeletons instantly */
      (function(){
        var done=false;
        var dataReady=false;

        function killNow(){
          if(done) return;
          done=true;
          ['sf-skel','inline-skel'].forEach(function(id){
            var s=document.getElementById(id);
            if(!s) return;
            /* Fade out smoothly so user never sees a blank flash */
            s.style.opacity='0';
            s.style.pointerEvents='none';
            setTimeout(function(){
              if(s.parentNode) s.parentNode.removeChild(s);
            },220);
          });
        }

        function hasRealContent(){
          var root=document.getElementById('root');
          if(!root) return false;
          /* Real content = wrapper has substantial height. We do NOT wait for
             images to finish decoding — Supabase image-transform can take 2-3s
             per image, which would block FCP unnecessarily. The product card
             grid reserves layout space (aspect-ratio), so fading the skeleton
             on first commit shows the user the page structure immediately
             while images stream in progressively (browser-native behavior). */
          var totalHeight=0;
          var kids=root.children;
          for(var i=0;i<kids.length;i++){
            totalHeight+=kids[i].offsetHeight;
          }
          /* Need real React content (not just early shell). 120px is enough
             for mobile nav + first content row; waiting for 400px can keep
             the skeleton visible too long on cold mobile loads. */
          return totalHeight>=120;
        }

        function waitForPaint(){
          if(done) return;
          if(hasRealContent()){
            requestAnimationFrame(function(){
              requestAnimationFrame(killNow);
            });
            return;
          }
          /* Poll every 32ms (~2 frames) up to ~10s after start */
          if(waitForPaint._tries===undefined) waitForPaint._tries=0;
          waitForPaint._tries++;
          if(waitForPaint._tries>300){killNow();return;}
          setTimeout(waitForPaint,32);
        }

        window.addEventListener('storefront:content-ready',function(){
          dataReady=true;
          waitForPaint();
        },{once:true});

        /* Also start polling immediately — handles cases where the
           content-ready event fires before this listener attaches, or where
           a page (e.g. error/empty state) never dispatches it but still
           paints valid content. */
        if(document.readyState!=='loading'){
          setTimeout(waitForPaint,200);
        }else{
          document.addEventListener('DOMContentLoaded',function(){setTimeout(waitForPaint,200);},{once:true});
        }

        /* Hard fallback: 12s timeout */
        setTimeout(killNow,12000);
      })();
    </script>
    <script>
      (function(){
        var p=location.pathname;
        var isStorefront=p.indexOf('/store/')===0;
        var h=location.hostname;
        if(!isStorefront && h.endsWith('.shopbanao.in') && h!=='shopbanao.in' && h!=='www.shopbanao.in'){
          var sub=h.replace('.shopbanao.in','');
          if(sub && sub.indexOf('.')===-1) isStorefront=true;
        }
        if(!isStorefront && !h.endsWith('.lovable.app') && h!=='localhost' && !p.startsWith('/dashboard') && !p.startsWith('/admin') && !p.startsWith('/login') && !p.startsWith('/signup')){
          if(window.__STORE_SLUG__) isStorefront=true;
        }
        if(isStorefront){
          document.title='';
          var desc=document.querySelector('meta[name="description"]');if(desc)desc.setAttribute('content','');
          var ogT=document.querySelector('meta[property="og:title"]');if(ogT)ogT.setAttribute('content','');
          var ogD=document.querySelector('meta[property="og:description"]');if(ogD)ogD.setAttribute('content','');
          var ogI=document.querySelector('meta[property="og:image"]');if(ogI)ogI.setAttribute('content','');
          var twT=document.querySelector('meta[name="twitter:title"]');if(twT)twT.setAttribute('content','');
          var twD=document.querySelector('meta[name="twitter:description"]');if(twD)twD.setAttribute('content','');
          var twI=document.querySelector('meta[name="twitter:image"]');if(twI)twI.setAttribute('content','');
          var fav=document.querySelector('link[rel="icon"]');if(fav)fav.setAttribute('href','');
        }
      })();
