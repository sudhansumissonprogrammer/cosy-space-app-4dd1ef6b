    <!--
      Lightweight prefetch: only starts /api/products fetch early.
      No DOM manipulation, no image preloading, no hybrid card injection.
    -->
    <script>
      (function(){
        // If Worker already injected __STOREFRONT_DATA__, just kick off /api/products fetch
        if(window.__STOREFRONT_DATA__){
          window.__PRODUCTS_PREFETCH__=fetch(location.origin+'/api/products',{headers:{Accept:'application/json'}}).then(function(r){return r.json()}).catch(function(){return null});
          return;
        }

        var slug;
        if(window.__STORE_SLUG__){slug=window.__STORE_SLUG__;}
        if(!slug){var p=location.pathname;if(p.indexOf('/store/')===0){slug=p.split('/store/')[1];if(slug)slug=slug.split('/')[0];}}
        if(!slug){
          var h=location.hostname;
          if(h.endsWith('.storivo.in')&&h!=='storivo.in'&&h!=='www.storivo.in'){
            var sub=h.replace('.storivo.in','');
            if(sub&&sub.indexOf('.')===-1)slug=sub;
          }
        }
        if(!slug)return;

        var supaUrl='https://soxuyuupzodkufxbbndq.supabase.co';
        var key='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNveHV5dXVwem9ka3VmeGJibmRxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ1OTI5ODYsImV4cCI6MjA5MDE2ODk4Nn0.cnK4FujigfVvNaXfNwQBb9qUQei8IQecHbDoVjFewQU';

        // Fetch lightweight shell (store+categories+theme) — matches Worker's get_storefront_shell
        var p_=fetch(supaUrl+'/rest/v1/rpc/get_storefront_shell',{
          method:'POST',
          headers:{'Content-Type':'application/json','apikey':key,'Authorization':'Bearer '+key},
          body:JSON.stringify({_slug:slug})
        }).then(function(r){return r.json()}).then(function(data){
          if(data&&data.store){
            window.__STOREFRONT_DATA__=data;
            // Kick off products fetch separately via REST API
            var prodUrl=supaUrl+'/rest/v1/products?store_id=eq.'+data.store.id+'&is_active=eq.true&order=is_best_selling.desc,created_at.desc,id.asc&limit=20&select=id,category,cost_price,created_at,currency,description,image_url,is_active,is_best_selling,name,price,sale_price,sku,slug,stock_quantity,store_id,updated_at';
            window.__PRODUCTS_PREFETCH__=fetch(prodUrl,{headers:{'apikey':key,'Authorization':'Bearer '+key}}).then(function(r){return r.json()}).catch(function(){return null});
          }
          return data;
        }).catch(function(){return null});
        window.__STOREFRONT_PREFETCH__=p_;
      })();
    </script>

    <!-- Worker injects #sf-skel BEFORE #root. This script runs after both exist. -->
    <div id="root"></div>
    <script>
      /* Remove Worker skeleton — runs in body so #sf-skel exists */
      (function(){
        var done=false;
        function kill(){
          if(done) return;
          var s=document.getElementById('sf-skel');
          if(!s) return;
          done=true;
          s.style.opacity='0';
          s.style.visibility='hidden';
          s.style.display='none';
          if(s.remove) s.remove();
        }
        kill();
        requestAnimationFrame(kill);
        setTimeout(kill,120);
        setTimeout(kill,600);
        var root=document.getElementById('root');
        if(root && root.childElementCount===0){
          var mo=new MutationObserver(function(){
            if(root.childElementCount>0){
              mo.disconnect();
              kill();
            }
          });
          mo.observe(root,{childList:true});
          setTimeout(function(){mo.disconnect();kill();},1500);
        }
      })();
    </script>
    <script>
      (function(){
        var p=location.pathname;
        var isStorefront=p.indexOf('/store/')===0;
        var h=location.hostname;
        if(!isStorefront && h.endsWith('.storivo.in') && h!=='storivo.in' && h!=='www.storivo.in'){
          var sub=h.replace('.storivo.in','');
          if(sub && sub.indexOf('.')===-1) isStorefront=true;
        }
        if(!isStorefront && !h.endsWith('.lovable.app') && h!=='localhost' && !p.startsWith('/dashboard') && !p.startsWith('/admin') && !p.startsWith('/login') && !p.startsWith('/signup')){
          if(window.__STORE_SLUG__) isStorefront=true;
        }
        if(isStorefront){
          document.title='';
          var desc=document.querySelector('meta[name="description"]');if(desc)desc.setAttribute('content','');
          var ogT=document.querySelector('meta[property="og:title"]');if(ogT)ogT.setAttribute('content','');
          var ogD=document.querySelector('meta[property="og:description"]');if(ogD)ogD.setAttribute('content','');
          var twT=document.querySelector('meta[name="twitter:title"]');if(twT)twT.setAttribute('content','');
          var twD=document.querySelector('meta[name="twitter:description"]');if(twD)twD.setAttribute('content','');
        }
      })();
    </script>
