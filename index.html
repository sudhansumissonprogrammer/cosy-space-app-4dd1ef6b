    <!--
      Lightweight prefetch: only starts /api/products fetch early.
      No DOM manipulation, no image preloading, no hybrid card injection.
    -->
    <script>
      (function(){
        // If Worker already injected __STOREFRONT_DATA__, just kick off /api/products fetch
        if(window.__STOREFRONT_DATA__){
          window.__PRODUCTS_PREFETCH__=fetch(location.origin+'/api/products',{headers:{Accept:'application/json'}}).then(function(r){return r.json()}).catch(function(){return null});
          return;
        }

        var slug;
        if(window.__STORE_SLUG__){slug=window.__STORE_SLUG__;}
        if(!slug){var p=location.pathname;if(p.indexOf('/store/')===0){slug=p.split('/store/')[1];if(slug)slug=slug.split('/')[0];}}
        if(!slug){
          var h=location.hostname;
          if(h.endsWith('.shopbanao.in')&&h!=='shopbanao.in'&&h!=='www.shopbanao.in'){
            var sub=h.replace('.shopbanao.in','');
            if(sub&&sub.indexOf('.')===-1)slug=sub;
          }
        }
        if(!slug)return;

        var supaUrl='https://dqepeywgftbpxeeqfuwt.supabase.co';
        var key='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRxZXBleXdnZnRicHhlZXFmdXd0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUzMjgxMzksImV4cCI6MjA5MDkwNDEzOX0.OtLtoGBJZuEthQyePzNgAltWJwSUEpWl1z_Bx_FY6Mk';

        // Fetch lightweight shell (store+categories+theme) — matches Worker's get_storefront_shell
        var p_=fetch(supaUrl+'/rest/v1/rpc/get_storefront_shell',{
          method:'POST',
          headers:{'Content-Type':'application/json','apikey':key,'Authorization':'Bearer '+key},
          body:JSON.stringify({_slug:slug})
        }).then(function(r){return r.json()}).then(function(data){
          if(data&&data.store){
            window.__STOREFRONT_DATA__=data;
            // Kick off products fetch separately via REST API
            var prodUrl=supaUrl+'/rest/v1/products?store_id=eq.'+data.store.id+'&is_active=eq.true&order=is_best_selling.desc,created_at.desc,id.asc&limit=14&select=id,category,currency,description,image_url,is_active,is_best_selling,name,price,sale_price,slug,stock_quantity,store_id';
            window.__PRODUCTS_PREFETCH__=fetch(prodUrl,{headers:{'apikey':key,'Authorization':'Bearer '+key}}).then(function(r){return r.json()}).catch(function(){return null});
          }
          return data;
        }).catch(function(){return null});
        window.__STOREFRONT_PREFETCH__=p_;
      })();
    </script>

    <!-- Worker injects #sf-skel BEFORE #root. This script runs after both exist. -->
    <div id="root"></div>
    <script>
      /* Remove Worker skeleton — waits for storefront:content-ready (actual data)
         so there's ONE skeleton → real content with no intermediate flash. */
      (function(){
        var done=false;
        function kill(){
          if(done) return;
          var s=document.getElementById('sf-skel');
          if(!s) return;
          done=true;
          s.style.transition='opacity 150ms ease-out';
          s.style.opacity='0';
          setTimeout(function(){s.style.display='none';if(s.remove)s.remove();},160);
        }
        /* Listen for content-ready (products rendered) instead of just React mount */
        window.addEventListener('storefront:content-ready',function(){kill();},{once:true});
        /* Hard fallback: 12s timeout */
        setTimeout(kill,12000);
      })();
    </script>
    <script>
      (function(){
        var p=location.pathname;
        var isStorefront=p.indexOf('/store/')===0;
        var h=location.hostname;
        if(!isStorefront && h.endsWith('.shopbanao.in') && h!=='shopbanao.in' && h!=='www.shopbanao.in'){
          var sub=h.replace('.shopbanao.in','');
          if(sub && sub.indexOf('.')===-1) isStorefront=true;
        }
        if(!isStorefront && !h.endsWith('.lovable.app') && h!=='localhost' && !p.startsWith('/dashboard') && !p.startsWith('/admin') && !p.startsWith('/login') && !p.startsWith('/signup')){
          if(window.__STORE_SLUG__) isStorefront=true;
